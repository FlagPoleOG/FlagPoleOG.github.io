<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Send Feedback · Second Shift Software</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root { --ink:#0d1117; --panel:#151b24; --line:#263041; --text:#e6e9ef; --muted:#8d97a8; --amber:#f2a93b; color-scheme: dark; }
* { box-sizing: border-box; }
body { margin:0; background:var(--ink); color:var(--text); font:400 17px/1.6 "IBM Plex Sans","Segoe UI",system-ui,sans-serif; }
a { color:var(--amber); }
header { border-bottom:1px solid var(--line); }
.wrap { max-width:760px; margin:0 auto; padding-inline:20px; }
.bar { padding-block:18px; }
.bar a { color:var(--text); text-decoration:none; font:800 14px/1 "Archivo",Arial,sans-serif; font-stretch:112%; letter-spacing:.12em; text-transform:uppercase; }
main { padding-block:44px 64px; }
.label { font:500 13px/1 "IBM Plex Mono",Consolas,monospace; color:var(--amber); letter-spacing:.08em; text-transform:uppercase; margin:0 0 16px; }
h1 { font:900 clamp(36px,6vw,56px)/1 "Archivo",Arial,sans-serif; font-stretch:70%; text-transform:uppercase; margin:0 0 14px; }
.lede { color:var(--muted); margin:0 0 28px; max-width:36em; }
.form { background:#fff; border-radius:10px; overflow:hidden; border:1px solid var(--line); }
.form iframe { display:block; width:100%; height:1100px; border:0; }
.alt { color:var(--muted); font-size:15px; margin-top:18px; }
@media (max-width:480px) { .wrap { padding-inline:12px; } .form iframe { height:1250px; } }
</style>
<script data-goatcounter="https://flagpoleog.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</head>
<body>
<header><div class="wrap bar"><a href="/">Second Shift Software</a></div></header>
<main class="wrap">
  <p class="label">Feedback</p>
  <h1>Tell me what you think</h1>
  <p class="lede">Found a bug, have an idea, or something just doesn't make sense? I read every message. Leave your email if you want a reply.</p>
  <div class="form">
    <iframe id="form" title="Second Shift Software feedback form" src="https://docs.google.com/forms/d/e/1FAIpQLSfCmPvHgiuEyqk4yoWYOCiPEt5gy99WyP46xc3Kww2oS5cqHA/viewform?embedded=true">Loading…</iframe>
  </div>
  <p class="alt">Form not loading? <a id="direct" href="https://docs.google.com/forms/d/e/1FAIpQLSfCmPvHgiuEyqk4yoWYOCiPEt5gy99WyP46xc3Kww2oS5cqHA/viewform">Open it in a new page</a>.</p>
</main>
<script>
(function () {
  var apps = { droptrace: "DropTrace", "droptrace-pro": "DropTrace Pro", foldertrace: "FolderTrace" };
  var app = apps[(new URLSearchParams(location.search).get("app") || "").toLowerCase()];
  if (!app) return;
  var base = "https://docs.google.com/forms/d/e/1FAIpQLSfCmPvHgiuEyqk4yoWYOCiPEt5gy99WyP46xc3Kww2oS5cqHA/viewform";
  var pre = "usp=pp_url&entry.1313925532=" + encodeURIComponent(app);
  document.getElementById("form").src = base + "?embedded=true&" + pre;
  document.getElementById("direct").href = base + "?" + pre;
})();
</script>
</body>
</html>
